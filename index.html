let db=loadDB();
function loadDB(){
  let d=null;
  try{const r=localStorage.getItem(KEY);if(r)d=JSON.parse(r);}catch(e){}
  if(!d)d={children:[],growth:[],vaccines:[],illnesses:[],teeth:[],milestones:[],currentChildId:null};
  ['children','growth','vaccines','illnesses','teeth','milestones'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  return d;
}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){alert('保存失败：本地存储空间可能已满');return false;}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function childEmoji(c){return c.sex==='male'?'👦':'👧';}

function today(){const d=new Date();return d.toISOString().slice(0,10);}
function ageMonths(birth,date){
  const b=new Date(birth+'T00:00:00'),d=new Date((date||today())+'T00:00:00');
  return (d-b)/(1000*60*60*24*30.4375);
}
function fmtAge(m){
  if(!isFinite(m)||m<0)return '—';
  const y=Math.floor(m/12),mo=Math.round(m%12);
  if(y>0)return mo>0?y+'岁'+mo+'个月':y+'岁';
  return Math.round(m)+'个月';
}
function fmtNum(v){return (Math.round(v*10)/10).toString();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function addMonths(dateStr,m){
  const d=new Date(dateStr+'T00:00:00');d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10);
}

function pickAvatar(childId){
  const id=childId||db.currentChildId;
  const c=db.children.find(x=>x.id===id);
  if(!c){alert('请先添加宝宝档案');return;}
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*';
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=function(){
    const f=inp.files&&inp.files[0];
    if(!f){inp.remove();return;}
    if(!/^image\//.test(f.type)){alert('请选择图片文件');inp.remove();return;}
    compressSquareImage(f,256,function(dataUrl){
      inp.remove();
      if(!dataUrl){alert('图片处理失败，请换一张试试');return;}
      c.avatar=dataUrl;
      if(saveDB())renderAll();
    });
  };
  inp.click();
}

function compressSquareImage(file,size,cb){
  const rd=new FileReader();
  rd.onload=function(){
    const img=new Image();
    img.onload=function(){
      try{
        const side=Math.min(img.width,img.height);
        const sx=(img.width-side)/2, sy=(img.height-side)/2;
        const cv=document.createElement('canvas');
        cv.width=size;cv.height=size;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
        ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
        cb(cv.toDataURL('image/jpeg',0.82));
      }catch(err){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=rd.result;
  };
  rd.onerror=function(){cb(null);};
  rd.readAsDataURL(file);
}

const ANCHOR={
 height:{
  male:[[0,49.9],[3,61.4],[6,67.6],[9,72.0],[12,75.7],[18,82.3],[24,87.8],[30,91.9],[36,96.1],[48,103.3],[60,110.0]],

 },
 weight:{
  male:[[0,3.3],[3,6.4],[6,8.0],[9,9.0],[12,9.6],[18,10.9],[24,12.2],[30,13.3],[36,14.3],[48,16.3],[60,18.3]],
  female:[[0,3.2],[3,5.8],[6,7.3],[9,8.2],[12,8.9],[18,10.2],[24,11.5],[30,12.7],[36,13.9],[48,16.1],[60,18.2]]
 }
};
function lerpAnchor(arr,m){
  if(m<=arr[0][0])return arr[0][1];
  if(m>=arr[arr.length-1][0])return arr[arr.length-1][1];
  for(let i=0;i<arr.length-1;i++){
    const a=arr[i][0],va=arr[i][1],b=arr[i+1][0],vb=arr[i+1][1];
    if(m>=a&&m<=b)return va+(vb-va)*((m-a)/(b-a));
  }
  return arr[arr.length-1][1];
}
function buildDemoBands(type,sex){
  const out=[];
  for(let m=0;m<=60;m++){
    const p50=lerpAnchor(ANCHOR[type][sex],m);
    const spread=type==='height'?(0.05*p50+0.6):(0.13*p50+0.15);
    out.push({m:m,p3:p50-spread,p15:p50-spread*0.55,p50:p50,p85:p50+spread*0.55,p97:p50+spread});
  }
  return out;
}

let standards=loadStandards();
function loadStandards(){
  try{const r=localStorage.getItem(STD_KEY);if(r)return JSON.parse(r);}catch(e){}

}
function getBands(type,sex){
  if(standards&&standards[type]&&standards[type][sex]&&standards[type][sex].length){
    return {bands:standards[type][sex],demo:false,source:standards.source||'已导入标准'};
  }
  return {bands:buildDemoBands(type,sex),demo:true,source:'演示数据'};
}

function niceStep(raw){
  const p=Math.pow(10,Math.floor(Math.log10(raw)));
  const n=raw/p;
  if(n<=1)return p;if(n<=2)return 2*p;if(n<=5)return 5*p;return 10*p;
}
function drawChart(cv,cfg){
  if(!cv||!cv.clientWidth)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cfg.height||240;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const pad={l:38,r:14,t:16,b:26};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const X=function(m){return pad.l+pw*(m/cfg.xMax);};
  const Y=function(v){return pad.t+ph*(1-(v-cfg.yMin)/(cfg.yMax-cfg.yMin));};
  const bands=cfg.bands;

  const yStep=niceStep((cfg.yMax-cfg.yMin)/4);
  ctx.font='10px sans-serif';ctx.textBaseline='middle';
  for(let v=Math.ceil(cfg.yMin/yStep)*yStep;v<=cfg.yMax;v+=yStep){
    const y=Y(v);
    ctx.strokeStyle='#eef1f6';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#9aa4b2';ctx.textAlign='right';ctx.fillText(fmtNum(v),pad.l-6,y);
  }
  const xStep=cfg.xMax<=24?6:(cfg.xMax<=60?12:24);
  ctx.textAlign='center';ctx.textBaseline='top';
  for(let m=0;m<=cfg.xMax;m+=xStep){
    ctx.fillStyle='#9aa4b2';ctx.fillText(m+'月',X(m),H-pad.b+7);
  }

  function refLine(key,color,w,dash){
    ctx.beginPath();
    bands.forEach(function(b,i){i?ctx.lineTo(X(b.m),Y(b[key])):ctx.moveTo(X(b.m),Y(b[key]));});
    ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash||[]);
    ctx.stroke();ctx.setLineDash([]);
  }
  refLine('p3','#b6d0e8',1);
  refLine('p97','#b6d0e8',1);
  refLine('p15','#8db9e0',1);
  refLine('p85','#8db9e0',1);
  refLine('p50','#5f9fd8',1.2,[5,4]);

  const pts=cfg.points.filter(function(p){return p.y!=null&&isFinite(p.y);}).sort(function(a,b){return a.x-b.x;});
  if(pts.length){
    ctx.beginPath();
    pts.forEach(function(p,i){i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y));});
    ctx.strokeStyle='#e8722d';ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.stroke();
    pts.forEach(function(p){
      ctx.beginPath();ctx.arc(X(p.x),Y(p.y),3.6,0,Math.PI*2);
      ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#e8722d';ctx.lineWidth=2;ctx.stroke();
    });
  }else{
    ctx.fillStyle='#b6c0cd';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('暂无数据',pad.l+pw/2,pad.t+ph/2);
  }
}

function openForm(title,fields,onSubmit){

  const body=fields.map(function(f){
    const v=f.value==null?'':esc(f.value);
    if(f.type==='select'){
      return '<div class="field"><label>'+esc(f.label)+'</label><select name="'+f.name+'">'+
        f.options.map(function(o){return '<option value="'+esc(o.value)+'"'+(String(o.value)===String(f.value)?' selected':'')+'>'+esc(o.label)+'</option>';}).join('')+
        '</select></div>';
    }
    if(f.type==='textarea'){
      return '<div class="field"><label>'+esc(f.label)+'</label><textarea name="'+f.name+'" placeholder="'+esc(f.placeholder||'')+'">'+v+'</textarea></div>';
    }
    return '<div class="field"><label>'+esc(f.label)+'</label><input name="'+f.name+'" type="'+(f.type||'text')+'" '+(f.type==='number'?'inputmode="decimal" step="0.1"':'')+' value="'+v+'" placeholder="'+esc(f.placeholder||'')+'"></div>';
  }).join('');
  root.innerHTML='<div class="modal-mask"><div class="modal">'+
    '<div class="modal-title">'+esc(title)+'</div>'+
    '<div class="modal-body">'+body+'</div>'+
    '<div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button><button class="btn primary" data-act="ok">保存</button></div>'+
    '</div></div>';
  const mask=root.querySelector('.modal-mask');
  function close(){root.innerHTML='';}
  mask.addEventListener('click',function(e){
    if(e.target.dataset.act==='cancel'||e.target===mask){close();return;}
    if(e.target.dataset.act==='ok'){
      const data={};
      fields.forEach(function(f){
        const el=root.querySelector('[name="'+f.name+'"]');
        data[f.name]=el?el.value.trim():'';
      });
      const err=onSubmit(data);
      if(err){alert(err);return;}
      close();
    }
  });
}

function renderGrowth(){
  const el=document.getElementById('page-growth');
  const c=curChild();
  if(!c){el.innerHTML='<div class="card"><div class="empty">请先在设置中添加宝宝</div></div>';return;}
  const isH=growthType==='height';
  const std=getBands(isH?'height':'weight',c.sex);

  const recs=db.growth.filter(function(x){return x.childId===c.id;}).sort(function(a,b){return a.date<b.date?-1:1;});
  const points=recs.map(function(r){return {x:ageMonths(c.birthDate,r.date),y:isH?parseFloat(r.height):parseFloat(r.weight),date:r.date};}).filter(function(p){return isFinite(p.y);});
  const maxAge=Math.max(points.length?points[points.length-1].x:0,12);
  const xMax=Math.min(Math.max(Math.ceil(maxAge/6)*6,24),std.bands[std.bands.length-1].m);
  const visBands=std.bands.filter(function(b){return b.m<=xMax;});

  const vals=[];
  visBands.forEach(function(b){vals.push(b.p3,b.p97);});
  points.forEach(function(p){if(p.x<=xMax)vals.push(p.y);});
  let yMin=Math.min.apply(null,vals),yMax=Math.max.apply(null,vals);
  const padY=(yMax-yMin)*0.1||2;
  yMin-=padY;yMax+=padY;

  el.innerHTML=
  '<div class="seg">'+
    '<button data-growth="height" class="'+(isH?'on':'')+'">身高曲线</button>'+
    '<button data-growth="weight" class="'+(!isH?'on':'')+'">体重曲线</button>'+
  '</div>'+
  '<div class="card">'+
    '<h2>'+(isH?'身高-年龄':'体重-年龄')+'<small>'+esc(std.source)+'</small>'+(std.demo?'<span class="badge demo">演示数据</span>':'')+'</h2>'+
    '<canvas class="chart" id="chart"></canvas>'+
    '<div class="legend">'+
      '<span><i style="border-top:1px solid #b6d0e8"></i>P3 / P97</span>'+
      '<span><i style="border-top:1px solid #8db9e0"></i>P15 / P85</span>'+
      '<span><i style="border-top:1px dashed #5f9fd8"></i>P50 中位</span>'+
      '<span><i style="border-top:2px solid #e8722d"></i>宝宝</span>'+
    '</div>'+
    (std.demo?'<div class="warnbox" style="margin-top:10px">当前为标准曲线的<strong>演示数据</strong>，仅用于展示图表效果，<strong>不可用于判断生长发育</strong>。请在「设置 → 标准曲线数据」中导入权威数据。</div>':'')+
  '</div>'+

  '<div class="card"><h2>测量记录 <small>共 '+recs.length+' 条</small></h2>'+
    (recs.length?recs.slice().reverse().map(function(r){return '<div class="item">'+
      '<div class="main"><div class="t1">'+(r.height?r.height+' cm':'')+(r.height&&r.weight?' · ':'')+(r.weight?r.weight+' kg':'')+(r.headCirc?' · 头围 '+r.headCirc+' cm':'')+'</div>'+
      '<div class="t2">'+r.date+' · '+fmtAge(ageMonths(c.birthDate,r.date))+(r.note?' · '+esc(r.note):'')+'</div></div>'+
      '<button class="btn danger small" data-del-growth="'+r.id+'">删</button></div>';}).join(''):'<div class="empty">还没有测量记录</div>')+
    '<button class="btn primary block" style="margin-top:12px" data-act="addGrowth">+ 添加测量</button>'+
  '</div>';

  requestAnimationFrame(function(){
    const cv=document.getElementById('chart');
    if(cv)drawChart(cv,{bands:visBands,points:points,xMax:xMax,yMin:yMin,yMax:yMax});
  });
}

function renderVaccine(c){
  const done={};
  db.vaccines.filter(function(v){return v.childId===c.id;}).forEach(function(v){done[v.key]=v;});

  let html='<div class="card"><h2>国家免疫规划疫苗<small>按出生日期自动排期</small></h2>';
  VAX_PLAN.forEach(function(g){
    html+='<div style="margin-top:10px;font-size:12px;color:var(--muted);font-weight:600">'+(g.m<12?g.m+'月龄':(g.m/12)+'岁')+' <span style="font-weight:400">· 计划 '+addMonths(c.birthDate,g.m)+'</span></div>';

      html+='<div class="item"><div class="main">'+

function downloadBlob(blob,filename){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

function downloadIcon(size){
  const svgBlob=new Blob([ICON_SVG],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);
  const img=new Image();
  img.onload=function(){
    try{
      const cv=document.createElement('canvas');
      cv.width=size;cv.height=size;
      const ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,size,size);
      URL.revokeObjectURL(url);
      if(cv.toBlob){
        cv.toBlob(function(b){
          if(b)downloadBlob(b,'icon-'+size+'.png');
          else alert('图标生成失败，请换用其他浏览器试试');
        },'image/png');
      }else{
        const a=document.createElement('a');
        a.href=cv.toDataURL('image/png');
        a.download='icon-'+size+'.png';
        a.click();
      }
    }catch(err){
      URL.revokeObjectURL(url);
      alert('图标生成失败：'+err.message);
    }
  };
  img.onerror=function(){
    URL.revokeObjectURL(url);
    alert('图标生成失败，请换用其他浏览器试试');
  };
  img.src=url;
}

function downloadManifest(){
  const m={
    name:APP_INFO.name,
    short_name:APP_INFO.name,
    start_url:'./index.html',
    scope:'./',
    display:'standalone',
    orientation:'portrait',
    background_color:'#f4f6fa',
    theme_color:'#4a90d9',
    icons:[
      {src:'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any'},
      {src:'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any'}
    ]
  };
  downloadBlob(new Blob([JSON.stringify(m,null,2)],{type:'application/json'}),'manifest.json');
}

const SW_JS=[
"const CACHE='growtrack-v2';",
"const ASSETS=['./index.html','./manifest.json'];",
"self.addEventListener('install',e=>{",
"  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));",
"});",
"self.addEventListener('activate',e=>{",
"  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));",
"});",
"self.addEventListener('fetch',e=>{",
"  if(e.request.method!=='GET')return;",
"  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{",
"    const copy=resp.clone();",
"    caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});",
"    return resp;",
"  }).catch(()=>caches.match('./index.html'))));",
"});"
].join('\n');

function downloadSW(){
  downloadBlob(new Blob([SW_JS],{type:'text/javascript'}),'sw.js');
}

document.getElementById('tabbar').addEventListener('click',function(e){
  const btn=e.target.closest('button[data-tab]');if(!btn)return;
  activeTab=btn.dataset.tab;
  document.querySelectorAll('#tabbar button').forEach(function(b){b.classList.toggle('on',b===btn);});
  document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('active',p.id==='page-'+activeTab);});
  if(activeTab==='growth')renderGrowth();
});

document.getElementById('btnSwitch').addEventListener('click',function(){
  const others=db.children.filter(function(c){return c.id!==db.currentChildId;});
  if(!others.length)return;
  openForm('切换宝宝',[{name:'id',label:'选择',type:'select',value:others[0].id,
    options:others.map(function(c){return {value:c.id,label:c.name};})}],function(d){
    db.currentChildId=d.id;saveDB();renderAll();
  });
});

document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act],[data-growth],[data-health],[data-del-growth],[data-del-ill],[data-del-vax],[data-del-mile],[data-del-child],[data-switch],[data-vax],[data-tooth],[data-mile]');
  if(!t)return;
  const d=t.dataset;

  if(d.act==='addChild')return addChild();
  if(d.act==='addGrowth')return addGrowth();
  if(d.act==='addIllness')return addIllness();
  if(d.act==='addTooth')return addTooth();
  if(d.act==='goMile'){healthTab='mile';document.querySelector('[data-tab="health"]').click();return;}
  if(d.act==='pickAvatar')return pickAvatar(d.avatarChild||null);
  if(d.act==='clearAvatar'){
    const c=db.children.find(function(x){return x.id===d.avatarChild;});
    if(c&&confirm('移除「'+c.name+'」的头像？')){
      delete c.avatar;saveDB();renderAll();
    }
    return;
  }
  if(d.act==='importStd')return importStandards();
  if(d.act==='clearStd'){localStorage.removeItem(STD_KEY);standards=null;renderAll();return;}
  if(d.act==='export')return exportData();
  if(d.act==='import')return importData();
  if(d.act==='dlIcon192')return downloadIcon(192);
  if(d.act==='dlIcon512')return downloadIcon(512);
  if(d.act==='dlManifest')return downloadManifest();
  if(d.act==='dlSW')return downloadSW();

  if(d.growth){growthType=d.growth;renderGrowth();return;}
  if(d.health){healthTab=d.health;renderHealth();return;}

  if(d.delGrowth){
    if(confirm('删除这条测量记录？')){db.growth=db.growth.filter(function(x){return x.id!==d.delGrowth;});saveDB();renderAll();}
    return;
  }
  if(d.delIll){
    if(confirm('删除这条生病记录？')){db.illnesses=db.illnesses.filter(function(x){return x.id!==d.delIll;});saveDB();renderAll();}
    return;
  }
  if(d.delVax){
    if(confirm('撤销这条接种记录？')){db.vaccines=db.vaccines.filter(function(x){return x.id!==d.delVax;});saveDB();renderAll();}
    return;
  }
  if(d.delMile){
    if(confirm('删除这条里程碑记录？')){db.milestones=db.milestones.filter(function(x){return x.id!==d.delMile;});saveDB();renderAll();}
    return;
  }
  if(d.delChild){
    const c=db.children.find(function(x){return x.id===d.delChild;});
    if(confirm('删除「'+c.name+'」及其全部记录？此操作不可恢复。')){
      db.children=db.children.filter(function(x){return x.id!==d.delChild;});
      ['growth','vaccines','illnesses','teeth','milestones'].forEach(function(k){db[k]=db[k].filter(function(x){return x.childId!==d.delChild;});});
      if(db.currentChildId===d.delChild)db.currentChildId=db.children[0]?db.children[0].id:null;
      saveDB();renderAll();
    }
    return;
  }
  if(d.switch){db.currentChildId=d.switch;saveDB();renderAll();return;}

  if(d.vax){
    const c=curChild();if(!c)return;
    openForm('记录接种：'+d.vax,[
      {name:'date',label:'接种日期',type:'date',value:today()},
      {name:'note',label:'备注（可选）',type:'text',placeholder:'如：批号、接种门诊'}
    ],function(v){
      if(!v.date)return '请选择日期';
      db.vaccines.push({id:uid(),childId:c.id,key:d.vax,date:v.date,note:v.note});
      saveDB();renderAll();
    });
    return;
  }

  if(d.mile){
    const c=curChild();if(!c)return;
    const m=MILESTONES.find(function(x){return x.k===d.mile;});
    openForm('记录里程碑：'+(m?m.n:d.mile),[
      {name:'date',label:'达成日期',type:'date',value:today()},
      {name:'note',label:'备注（可选）',type:'text',placeholder:'如：第一次独立坐稳'}
    ],function(v){
      if(!v.date)return '请选择日期';
      db.milestones.push({id:uid(),childId:c.id,key:d.mile,date:v.date,note:v.note});
      saveDB();renderAll();
    });
    return;
  }

  if(d.tooth){
    const c=curChild();if(!c)return;
    const exist=db.teeth.find(function(x){return x.childId===c.id&&x.tooth===d.tooth;});
    if(exist){
      if(confirm('撤销「'+d.tooth+'」的出牙记录？')){db.teeth=db.teeth.filter(function(x){return x.id!==exist.id;});saveDB();renderAll();}
      return;
    }
    openForm('记录出牙：'+d.tooth,[
      {name:'date',label:'萌出日期',type:'date',value:today()}
    ],function(v){
      if(!v.date)return '请选择日期';
      db.teeth.push({id:uid(),childId:c.id,tooth:d.tooth,date:v.date});
      saveDB();renderAll();
    });
    return;
  }
});

function addChild(){
  openForm('添加宝宝',[
    {name:'name',label:'姓名 / 小名',type:'text',placeholder:'如：小满'},
    {name:'birthDate',label:'出生日期',type:'date',value:today()},
    {name:'sex',label:'性别',type:'select',value:'male',options:[{value:'male',label:'男'},{value:'female',label:'女'}]}
  ],function(v){
    if(!v.name)return '请填写姓名';
    if(!v.birthDate)return '请选择出生日期';
    const c={id:uid(),name:v.name,birthDate:v.birthDate,sex:v.sex};
    db.children.push(c);
    if(!db.currentChildId)db.currentChildId=c.id;
    saveDB();renderAll();
  });
}

function addGrowth(){
  const c=curChild();if(!c)return addChild();
  openForm('添加测量记录',[
    {name:'date',label:'测量日期',type:'date',value:today()},
    {name:'height',label:'身高 / 身长（cm）',type:'number',placeholder:'如 75.5'},
    {name:'weight',label:'体重（kg）',type:'number',placeholder:'如 9.6'},
    {name:'headCirc',label:'头围（cm，可选）',type:'number',placeholder:'如 45.0'},
    {name:'note',label:'备注（可选）',type:'text'}
  ],function(v){
    if(!v.date)return '请选择日期';
    if(!v.height&&!v.weight)return '身高和体重至少填一项';
    db.growth.push({id:uid(),childId:c.id,date:v.date,
      height:v.height,weight:v.weight,headCirc:v.headCirc,note:v.note});
    saveDB();renderAll();
  });
}

function addIllness(){
  const c=curChild();if(!c)return addChild();
  openForm('添加生病记录',[
    {name:'startDate',label:'开始日期',type:'date',value:today()},
    {name:'endDate',label:'痊愈日期（可选）',type:'date'},
    {name:'symptoms',label:'症状',type:'text',placeholder:'如：发热、咳嗽、腹泻'},
    {name:'temp',label:'最高体温（℃，可选）',type:'number',placeholder:'如 38.5'},
    {name:'doctor',label:'是否就医',type:'select',value:'no',options:[{value:'no',label:'未就医'},{value:'yes',label:'已就医'}]},
    {name:'meds',label:'用药（可选）',type:'text'},
    {name:'note',label:'备注（可选）',type:'textarea'}
  ],function(v){
    if(!v.startDate)return '请选择开始日期';
    if(!v.symptoms)return '请填写症状';
    db.illnesses.push({id:uid(),childId:c.id,startDate:v.startDate,endDate:v.endDate,
      symptoms:v.symptoms,temp:v.temp,doctor:v.doctor==='yes',meds:v.meds,note:v.note});
    saveDB();renderAll();
  });
}

function addTooth(){
  const c=curChild();if(!c)return addChild();
  const got={};
  db.teeth.filter(function(x){return x.childId===c.id;}).forEach(function(x){got[x.tooth]=1;});
  const free=TEETH.filter(function(t){return !got[t];});
  if(!free.length)return alert('20 颗乳牙都已记录完成');
  openForm('记录出牙',[
    {name:'tooth',label:'牙位',type:'select',value:free[0],options:free.map(function(t){return {value:t,label:t};})},
    {name:'date',label:'萌出日期',type:'date',value:today()}
  ],function(v){
    if(!v.date)return '请选择日期';
    db.teeth.push({id:uid(),childId:c.id,tooth:v.tooth,date:v.date});
    saveDB();renderAll();
  });
}

function exportData(){
  downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'成长记录备份_'+today()+'.json');
}

function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=function(){
      try{
        const data=JSON.parse(rd.result);
        if(!data.children||!Array.isArray(data.children))throw new Error('格式不正确');
        if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
        db=data;
        ['children','growth','vaccines','illnesses','teeth','milestones'].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[];});
        if(!db.currentChildId&&db.children[0])db.currentChildId=db.children[0].id;
        saveDB();renderAll();
        alert('导入成功');
      }catch(err){alert('导入失败：'+err.message);}
    };
    rd.readAsText(f);
  };
  inp.click();
}

function importStandards(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=function(){
      try{
        const data=JSON.parse(rd.result);
        const valid=function(type){return data[type]&&['male','female'].some(function(s){return Array.isArray(data[type][s])&&data[type][s].length;});};
        if(!valid('height')&&!valid('weight'))throw new Error('未找到 height 或 weight 数据');
        ['height','weight'].forEach(function(type){
          if(!data[type])return;
          ['male','female'].forEach(function(sex){
            if(!Array.isArray(data[type][sex]))return;
            data[type][sex].forEach(function(b){
              if(typeof b.m!=='number'||typeof b.p50!=='number')throw new Error(type+'/'+sex+' 中缺少 m 或 p50 字段');
            });
            data[type][sex].sort(function(a,b){return a.m-b.m;});
          });
        });
        standards=data;
        localStorage.setItem(STD_KEY,JSON.stringify(data));
        renderAll();
        alert('标准数据导入成功');
      }catch(err){alert('导入失败：'+err.message);}
    };
    rd.readAsText(f);
  };
  inp.click();
}

renderAll();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
